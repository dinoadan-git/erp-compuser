# /etc/nginx/sites-available/erp-compuser  (enlazar a sites-enabled)
server {
    listen 80;
    server_name TU_DOMINIO_O_IP;

    # Frontend (archivos estaticos del build de Vite)
    root /opt/erp-compuser/frontend/dist;
    index index.html;

    # SPA: todas las rutas que no sean archivo caen en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> backend Node en el puerto 4000
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 10m;
}
